<!doctype html><html lang="en"><meta charset="utf-8"><title>AutoCraft — Local image review</title><style>body{min-width:1120px;font:14px system-ui;margin:24px;background:#eeeae3;color:#222}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}button{padding:12px;cursor:pointer}article{background:white;margin:16px 0;padding:14px;break-inside:avoid}h2{font-size:16px;margin:0 0 10px}.images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0}img{width:100%;height:200px;object-fit:contain;background:#f2efe9}figcaption{font-size:11px;color:#666}input{width:60%;padding:8px;margin-top:8px}.small{font-size:12px}</style><header><h1>Product image review</h1><p id="status"></p><button id="approve">Record this page as visually checked</button><button id="reload">Reload</button></header><p class="small">Compare model / body style, complete wheels and body on solid/keychain, natural MDF, attached ring, and correct outline style. This review page is served only on loopback.</p><main id="rows"></main><p id="message"></p><script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let shown=[];
async function load(){const d=await fetch('/qa/data').then(r=>r.json());shown=d.items.slice(0,6);document.querySelector('#status').textContent=`${d.approved} checked · ${d.flagged} flagged · ${d.ready} photographed / ${d.total} cars`;document.querySelector('#rows').innerHTML=shown.map(m=>`<article data-id="${esc(m.id)}"><h2>${esc(m.name)} · ${esc(m.id)}</h2><div class="images"><figure><img src="${esc(m.outline)}" alt="Outline reference for ${esc(m.name)}"><figcaption>Black outline reference</figcaption></figure><figure><img src="${esc(m.solid)}" alt="Full wood wall art for ${esc(m.name)}"><figcaption>Full MDF wall art · complete car and wheels</figcaption></figure><figure><img src="${esc(m.key)}" alt="Wooden keychain for ${esc(m.name)}"><figcaption>Solid MDF keychain · complete car, chain and ring</figcaption></figure></div><input aria-label="Mismatch note for ${esc(m.name)}" placeholder="Mismatch details"><button data-flag="${esc(m.id)}">Flag for regeneration</button></article>`).join('')||'<p>No unreviewed completed models at this moment.</p>';document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=async()=>{const m=shown.find(m=>m.id===b.dataset.flag);await save('/qa/flag',[m],b.previousElementSibling.value);await load()})}
async function save(url,items,note=''){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:items.map(({id,version})=>({id,version})),note})});if(!r.ok)throw Error((await r.json()).error)}
document.querySelector('#approve').onclick=async()=>{try{await save('/qa/approve',shown);await load()}catch(e){document.querySelector('#message').textContent=e.message}};document.querySelector('#reload').onclick=load;load();
</script></html>
